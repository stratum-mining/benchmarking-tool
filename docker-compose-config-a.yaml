volumes:
  prometheus_data_config_a:
  grafana_data_config_a:
  bitcoin_pool_side_data:
  bitcoin_miner_side_data:
  bitcoin_sv1_pool_side_data:
  shared-mainnet-snapshot-volume:

networks:
  monitor-net:
  sv2-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
          gateway: 10.5.0.1

services:
  # ============================================================================
  # BUILDER SERVICES
  # ============================================================================
  
  bitcoin-core-builder:
    build:
      dockerfile: ./bitcoin-core.dockerfile
    container_name: bitcoin-core-builder
    image: bitcoin-core-builder-image
    command: echo "Bitcoin Core build completed"

  sv2-tp-builder:
    build:
      dockerfile: ./sv2-tp.dockerfile
    container_name: sv2-tp-builder
    image: sv2-tp-builder-image
    command: echo "sv2-tp build completed"

  sv2-custom-proxy-builder:
    build:
      dockerfile: ./sv2-custom-proxy/Dockerfile
    container_name: sv2-custom-proxy-builder
    image: sv2-custom-proxy-builder-image
    command: echo "sv2-custom-proxy build completed"

  sv1-custom-proxy-builder:
    build:
      dockerfile: ./sv1-custom-proxy/Dockerfile
    container_name: sv1-custom-proxy-builder
    image: sv1-custom-proxy-builder-image
    command: echo "sv1-custom-proxy build completed"

  pools-latency-calculator-builder:
    build:
      dockerfile: ./pools-latency-calculator/Dockerfile
    container_name: pools-latency-calculator-builder
    image: pools-latency-calculator-builder-image
    command: echo "pools-latency-calculator build completed"

  log-server-builder:
    build:
      dockerfile: ./log-server/Dockerfile
    container_name: log-server-builder
    image: log-server-builder-image
    command: echo "log-server-builder build completed"

  # ============================================================================
  # BITCOIN CORE NODES (10.5.0.2-10.5.0.4)
  # ============================================================================

  bitcoin-core-pool-side:
    labels:
      logging: "config-a"
    image: bitcoin-core-builder-image
    entrypoint:
      - /bin/sh
      - -c
      - |
        /scripts/update-mainnet-chainstate.sh ${NETWORK}
        if [ -z "${NETWORK}" ]; then
          exec bitcoin -m node -ipcbind=unix
        else
          exec bitcoin -m node -ipcbind=unix -${NETWORK}
        fi
    depends_on:
      - bitcoin-core-builder
    ports:
      - "18333:48333"
      - "8332:8332"
      - "18332:18332"
    container_name: bitcoin-core-pool-side
    volumes:
      - bitcoin_pool_side_data:/root/.bitcoin
      - shared-mainnet-snapshot-volume:/shared_volume
      - ./custom-configs/sri-apps/bitcoin-tp-pool.conf:/root/.bitcoin/bitcoin.conf
      - ./containers-scripts:/scripts
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.2
    environment:
      - NETWORK=${NETWORK}
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh", "http://127.0.0.1:18332"]
      interval: 2m
      timeout: 30s
      retries: 100
      start_period: 1m

  bitcoin-core-miner-side:
    labels:
      logging: "config-a"
    image: bitcoin-core-builder-image
    entrypoint:
      - /bin/sh
      - -c
      - |
        /scripts/update-mainnet-chainstate.sh ${NETWORK}
        if [ -z "${NETWORK}" ]; then
          exec bitcoin -m node -ipcbind=unix
        else
          exec bitcoin -m node -ipcbind=unix -${NETWORK}
        fi
    depends_on:
      - bitcoin-core-builder
    ports:
      - "28333:18333"
    container_name: bitcoin-core-miner-side
    volumes:
      - bitcoin_miner_side_data:/root/.bitcoin
      - shared-mainnet-snapshot-volume:/shared_volume
      - ./custom-configs/sri-apps/bitcoin-tp-miner.conf:/root/.bitcoin/bitcoin.conf
      - ./containers-scripts:/scripts
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.3
    environment:
      - NETWORK=${NETWORK}
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh", "http://127.0.0.1:18332"]
      interval: 2m
      timeout: 30s
      retries: 100
      start_period: 1m

  sv1-node-pool-side:
    labels:
      logging: "config-a"
    image: bitcoin-core-builder-image
    entrypoint:
      - /bin/sh
      - -c
      - |
        /scripts/update-mainnet-chainstate.sh ${NETWORK}
        if [ -z "${NETWORK}" ]; then
          exec bitcoin -m node -ipcbind=unix
        else
          exec bitcoin -m node -ipcbind=unix -${NETWORK}
        fi
    depends_on:
      - bitcoin-core-builder
    ports:
      - "38333:18333"
      - "28332:18332"
      - "18443:18443"
    container_name: sv1-node-pool-side
    volumes:
      - bitcoin_sv1_pool_side_data:/root/.bitcoin
      - shared-mainnet-snapshot-volume:/shared_volume
      - ./custom-configs/sri-apps/bitcoin-sv1-node-pool.conf:/root/.bitcoin/bitcoin.conf
      - ./containers-scripts:/scripts
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.4
    environment:
      - NETWORK=${NETWORK}
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh", "http://127.0.0.1:18332"]
      interval: 2m
      timeout: 30s
      retries: 100
      start_period: 1m

  # ============================================================================
  # SV2 TEMPLATE PROVIDERS (10.5.0.10-10.5.0.12)
  # ============================================================================

  sv2-tp-pool-side:
    labels:
      logging: "config-a"
    image: sv2-tp-builder-image
    container_name: sv2-tp-pool-side
    ports:
      - "8441:8441"
    environment:
      - RUST_LOG=${LOG_LEVEL}
      - NETWORK=${NETWORK}
    volumes:
      - bitcoin_pool_side_data:/root/.bitcoin
    depends_on:
      bitcoin-core-pool-side:
        condition: service_healthy
        restart: true
      sv2-tp-builder:
        condition: service_started
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.10
    command: >
      sh -c '
        if [ -z "${NETWORK}" ] || [ "${NETWORK}" = "mainnet" ]; then
          sv2-tp -ipcconnect=unix -sv2bind=0.0.0.0:8441 -sv2interval=${TP_MIN_INTERVAL} -debug=sv2 -loglevel=sv2:trace
        else
          sv2-tp -chain=${NETWORK} -ipcconnect=unix -sv2bind=0.0.0.0:8441 -sv2interval=${TP_MIN_INTERVAL} -debug=sv2 -loglevel=sv2:trace
        fi
      '

  sv2-tp-miner-side:
    labels:
      logging: "config-a"
    image: sv2-tp-builder-image
    container_name: sv2-tp-miner-side
    ports:
      - "8442:8442"
    environment:
      - RUST_LOG=${LOG_LEVEL}
      - NETWORK=${NETWORK}
    volumes:
      - bitcoin_miner_side_data:/root/.bitcoin
    depends_on:
      bitcoin-core-miner-side:
        condition: service_healthy
        restart: true
      sv2-tp-builder:
        condition: service_started
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.11
    command: >
      sh -c '
        if [ -z "${NETWORK}" ] || [ "${NETWORK}" = "mainnet" ]; then
          sv2-tp -ipcconnect=unix -sv2bind=0.0.0.0:8442 -sv2interval=${TP_MIN_INTERVAL} -debug=sv2 -loglevel=sv2:trace
        else
          sv2-tp -chain=${NETWORK} -ipcconnect=unix -sv2bind=0.0.0.0:8442 -sv2interval=${TP_MIN_INTERVAL} -debug=sv2 -loglevel=sv2:trace
        fi
      '

  # ============================================================================
  # SV2 CORE SERVICES (10.5.0.20-10.5.0.24)
  # ============================================================================

  pool:
    image: stratumv2/pool_sv2:v0.2.0
    labels:
      logging: "config-a"
    env_file:
      - .env
    entrypoint: >
      sh -c '
        (apk add --no-cache curl iproute2 iptables 2>/dev/null || apt-get update -qq && apt-get install -y -qq curl iproute2 iptables 2>/dev/null || true) &&
        /app/monitor_and_apply_latency.sh 10.5.0.34 2 &
        envsubst < /app/pool-config.toml.template > /app/pool-config.toml &&
        exec /app/pool_sv2 -c /app/pool-config.toml
      '
    ports:
      - "34254:34254"
    environment:
      - RUST_LOG=${LOG_LEVEL}
      - TP_POOL_ADDRESS=10.5.0.10:8441
    container_name: sv2-pool
    depends_on:
      sv2-tp-pool-side:
        condition: service_started
    volumes:
      - ./custom-configs/sri-apps/pool-config.toml.template:/app/pool-config.toml.template:ro
      - ./pools-latency-calculator/monitor_and_apply_latency.sh:/app/monitor_and_apply_latency.sh:ro
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.20
    cap_add:
      - NET_ADMIN

  jd-server:
    image: stratumv2/jd_server:v0.2.0
    labels:
      logging: "config-a"
    env_file:
      - .env
    entrypoint: >
      sh -c '
        (apk add --no-cache curl iproute2 iptables 2>/dev/null || apt-get update -qq && apt-get install -y -qq curl iproute2 iptables 2>/dev/null || true) &&
        /app/monitor_and_apply_latency.sh 10.5.0.22 2 &
        envsubst < /app/jds-config.toml.template > /app/jds-config.toml &&
        exec /app/jd_server -c /app/jds-config.toml
      '
    ports:
      - "34264:34264"
    environment:
      - RUST_LOG=${LOG_LEVEL}
    container_name: sv2-jds
    depends_on:
      sv2-tp-pool-side:
        condition: service_started
    volumes:
      - ./custom-configs/sri-apps/jds-config.toml.template:/app/jds-config.toml.template:ro
      - ./pools-latency-calculator/monitor_and_apply_latency.sh:/app/monitor_and_apply_latency.sh:ro
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.21
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_ADMIN

  jd-client:
    image: stratumv2/jd_client_sv2:v0.2.0
    labels:
      logging: "config-a"
    env_file:
      - .env
    entrypoint: >
      sh -c '
        (apk add --no-cache curl iproute2 iptables 2>/dev/null || apt-get update -qq && apt-get install -y -qq curl iproute2 iptables 2>/dev/null || true) &&
        /app/monitor_and_apply_latency.sh 10.5.0.34 2 10.5.0.21 &
        envsubst < /app/jdc-config.toml.template > /app/jdc-config.toml &&
        exec /app/jd_client_sv2 -c /app/jdc-config.toml
      '
    ports:
      - "34265:34265"
    environment:
      - RUST_LOG=${LOG_LEVEL}
    container_name: sv2-jdc
    volumes:
      - ./custom-configs/sri-apps/jdc-config.toml.template:/app/jdc-config.toml.template:ro
      - ./pools-latency-calculator/monitor_and_apply_latency.sh:/app/monitor_and_apply_latency.sh:ro
    restart: unless-stopped
    depends_on:
      sv2-tp-miner-side:
        condition: service_started
      jd-server:
        condition: service_started
      pool:
        condition: service_started
    networks:
      sv2-net:
        ipv4_address: 10.5.0.22
    cap_add:
      - NET_ADMIN

  translator:
    image: stratumv2/translator_sv2:v0.2.0
    labels:
      logging: "config-a"
    env_file:
      - .env
    entrypoint: >
      sh -c '
        envsubst < /app/proxy-config.toml.template > /app/proxy-config.toml &&
        exec /app/translator_sv2 -c /app/proxy-config.toml
      '
    ports:
      - "34256:34256"
    environment:
      - RUST_LOG=${LOG_LEVEL}
      - TRANSLATOR_UPSTREAM_ADDRESS=10.5.0.32
      - TRANSLATOR_UPSTREAM_PORT=34266
    container_name: sv2-translator
    depends_on:
      - jd-client
      - sv2-jdc-translator-sniffer
    volumes:
      - ./custom-configs/sri-apps/translator-proxy-config.toml.template:/app/proxy-config.toml.template:ro
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.23

  # ============================================================================
  # SV2 PROXIES FOR MONITORING (10.5.0.31-10.5.0.34)
  # ============================================================================

  sv2-tp-jdc-sniffer:
    image: sv2-custom-proxy-builder-image
    labels:
      logging: "config-a"
    command: ["./sv2-custom-proxy"]
    ports:
      - "8440:8440"
      - "5678:5678"
    environment:
      - SERVER=10.5.0.11:8442
      - CLIENT=10.5.0.31:8440
      - PROM_ADDRESS=10.5.0.31:5678
      - PROXY_TYPE=tp-jdc
      - NETWORK=${NETWORK}
      - RUST_LOG=${LOG_LEVEL}
    container_name: sv2-tp-jdc-sniffer
    depends_on:
      sv2-tp-miner-side:
        condition: service_started
      sv2-custom-proxy-builder:
        condition: service_started
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.31

  sv2-pool-jdc-sniffer:
    image: sv2-custom-proxy-builder-image
    labels:
      logging: "config-a"
    command:
      [
        "/bin/sh",
        "-c",
        "./monitor_and_apply_latency.sh 10.5.0.20 2 & exec ./sv2-custom-proxy",
      ]
    ports:
      - "34252:34252"
      - "3457:3457"
    environment:
      - SERVER=10.5.0.20:34254
      - CLIENT=0.0.0.0:34252
      - PROM_ADDRESS=10.5.0.34:3457
      - PROXY_TYPE=pool-jdc
      - RUST_LOG=${LOG_LEVEL}
    container_name: sv2-pool-jdc-sniffer
    depends_on:
      - sv2-custom-proxy-builder
      - pool
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.34
    cap_add:
      - NET_ADMIN

  sv2-jdc-translator-sniffer:
    image: sv2-custom-proxy-builder-image
    labels:
      logging: "config-a"
    command: ["./sv2-custom-proxy"]
    ports:
      - "34266:34266"
      - "3458:3458"
    environment:
      - SERVER=10.5.0.22:34265
      - CLIENT=0.0.0.0:34266
      - PROM_ADDRESS=10.5.0.32:3458
      - PROXY_TYPE=jdc-translator
      - RUST_LOG=${LOG_LEVEL}
    container_name: sv2-jdc-translator-sniffer
    depends_on:
      - sv2-custom-proxy-builder
      - jd-client
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.32

  sv2-translator-miner-proxy:
    image: sv1-custom-proxy-builder-image
    labels:
      logging: "config-a"
    command: ["./sv1-custom-proxy"]
    ports:
      - "34255:34255"
      - "5676:5676"
    environment:
      - SERVER=0.0.0.0:34255
      - CLIENT=10.5.0.23:34256
      - PROM_ADDRESS=10.5.0.33:5676
      - PROXY_TYPE=translator-miner
      - RUST_LOG=${LOG_LEVEL}
    container_name: sv2-translator-miner-proxy
    depends_on:
      - sv1-custom-proxy-builder
      - translator
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.33

  # ============================================================================
  # SV1 SERVICES (10.5.0.40-10.5.0.43)
  # ============================================================================

  sv1-pool:
    container_name: sv1-pool
    labels:
      logging: "config-a"
    build:
      context: .
      dockerfile: ./sv1-public-pool.dockerfile
    ports:
      - "3332:3332"
      - "3334:3334"
    volumes:
      - "./testnet-DB:/public-pool/DB"
      - "./custom-configs/sv1-pool/.env:/public-pool/.env:ro"
      - "./custom-configs/sv1-pool/rpc.js:/public-pool/node_modules/rpc-bitcoin/build/src/rpc.js"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - sv1-node-pool-proxy
    networks:
      sv2-net:
        ipv4_address: 10.5.0.40
    cap_add:
      - NET_ADMIN

  sv1-pool-miner-proxy:
    image: sv1-custom-proxy-builder-image
    labels:
      logging: "config-a"
    command:
      [
        "/bin/sh",
        "-c",
        "./monitor_and_apply_latency.sh 10.5.0.40 2 & exec ./sv1-custom-proxy",
      ]
    ports:
      - "3333:3333"
      - "2345:2345"
    environment:
      - SERVER=10.5.0.40:3332
      - CLIENT=0.0.0.0:3333
      - PROM_ADDRESS=10.5.0.41:2345
      - PROXY_TYPE=pool-miner
      - RUST_LOG=${LOG_LEVEL}
    container_name: sv1-pool-miner-proxy
    depends_on:
      - sv1-custom-proxy-builder
      - sv1-pool
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.41
    cap_add:
      - NET_ADMIN

  sv1-node-pool-proxy:
    image: sv1-custom-proxy-builder-image
    labels:
      logging: "config-a"
    command: ["./sv1-custom-proxy"]
    ports:
      - "48330:48330"
      - "4567:4567"
    environment:
      - SERVER=http://10.5.0.4:18332
      - CLIENT=0.0.0.0:48330
      - PROM_ADDRESS=10.5.0.42:4567
      - PROXY_TYPE=node-pool
      - RUST_LOG=${LOG_LEVEL}
    container_name: sv1-node-pool-proxy
    depends_on:
      sv1-custom-proxy-builder: 
        condition: service_started
      sv1-node-pool-side:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.42

  # ============================================================================
  # MONITORING SERVICES (10.5.0.50-10.5.0.56)
  # ============================================================================

  prometheus:
    image: prom/prometheus:v2.36.2
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data_config_a:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    ports:
      - "9090:9090"
    container_name: prometheus
    depends_on:
      - cadvisor
    networks:
      sv2-net:
        ipv4_address: 10.5.0.50
    deploy:
      placement:
        constraints:
          - node.role==manager
      restart_policy:
        condition: on-failure
    extra_hosts:
      - "host.docker.internal:10.5.0.1"

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    ports:
      - "9100:9100"
    container_name: node-exporter
    networks:
      sv2-net:
        ipv4_address: 10.5.0.51
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    container_name: cadvisor
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      sv2-net:
        ipv4_address: 10.5.0.52
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:11.2.4
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_FILTERS: rendering:debug
    container_name: grafana
    volumes:
      - grafana_data_config_a:/var/lib/grafana
      - ./grafana/provisioning/dashboards/config-a:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    env_file:
      - ./grafana/config.monitoring
    networks:
      sv2-net:
        ipv4_address: 10.5.0.53
    user: "472"
    deploy:
      placement:
        constraints:
          - node.role==manager
      restart_policy:
        condition: on-failure

  reporter:
    image: izakmarais/grafana-reporter:${gr_version:-latest}
    command: "-ip grafana:3000 -grid-layout=1"
    container_name: reporter
    platform: linux/amd64
    depends_on:
      - grafana
    ports:
      - "8686:8686"
    networks:
      sv2-net:
        ipv4_address: 10.5.0.54

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: renderer
    depends_on:
      - grafana
    ports:
      - "8081:8081"
    networks:
      sv2-net:
        ipv4_address: 10.5.0.55

  monitor-traffic-tcpdump:
    image: inzania/network-traffic-metrics:latest
    network_mode: host
    container_name: monitor-traffic-tcpdump
    platform: linux/amd64
    environment:
      - "NTM_INTERFACE=any"
      - "NTM_FILTERS=net 10.5.0.0/24 and ip" 

  pools-latency-calculator:
    image: pools-latency-calculator-builder-image
    command: ["./pools-latency-calculator"]
    ports:
      - "1234:1234"
    container_name: pools-latency-calculator
    environment:
      - RUST_LOG=${LOG_LEVEL}
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.56

  # ============================================================================
  # LOGGING SERVICES (10.5.0.60-10.5.0.62)
  # ============================================================================

  loki:
      image: grafana/loki:2.9.8
      container_name: loki
      ports:
        - "3100:3100"
      restart: unless-stopped
      networks:
        sv2-net:
          ipv4_address: 10.5.0.60
          aliases:
            - loki
      volumes:
        - ./loki-config.yaml:/etc/loki/loki-config.yaml
      command: -config.file=/etc/loki/loki-config.yaml

  promtail:
    image: grafana/promtail
    container_name: promtail
    volumes:
      - ./promtail/config/config-a/promtail-local-config.yaml:/etc/promtail/config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      sv2-net:
        ipv4_address: 10.5.0.61
        aliases:
          - promtail
  
  log-server:
    image: log-server-builder-image
    command: ["./log-server"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "7420:7420"
    environment:
      - LOG_LABEL=config-a
      - RUST_LOG=${LOG_LEVEL}
    container_name: log-server
    depends_on:
      - log-server-builder
    restart: unless-stopped
    networks:
      sv2-net:
        ipv4_address: 10.5.0.62
